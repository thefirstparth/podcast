# The daily episode (engine/episode.mjs). Ready by 13:00 IST (Parth, 15 Oct): a Claude routine starts it at 12:28 IST; a
# run takes about ten minutes.
# GitHub's own timer is the safety net that needs nothing else: its scheduled runs start hours late (4.5 to 8 hours, 15 to
# 21 Oct), so it fires every half hour through the night and morning, and a first, seconds-long job lets through only the
# first run that lands after 12:28 IST on a day with no episode yet (Parth, 22 Oct). Scheduled runs are live.
# test: the rehearsal key, nothing published; the MP3, script and pack are kept as the run's artifacts.
# live: the live key; the episode goes to GitHub Releases and the feed to the gh-pages branch (GitHub Pages).
# The live key is used only by the live runs and a redo Parth asks for (agreed 15 Oct).
name: episode
on:
  workflow_dispatch:
    inputs:
      mode: { description: "test (rehearsal key, nothing published) or live", type: choice, options: [test, live], default: test }
      force: { description: "Live only: make it again even if today's is published", type: boolean, default: false }
  schedule:
    # every half hour from 03:31 to 15:01 IST, in UTC (odd minutes: GitHub starts runs set on the hour later still)
    - cron: "1,31 22,23 * * *"
    - cron: "1,31 0-9 * * *"
permissions: { contents: write }
jobs:
  # a scheduled run goes ahead only after 12:28 IST and only while today's episode is not out; a run started by hand
  # always goes ahead
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { go: "${{ steps.gate.outputs.go }}" }
    steps:
      - id: gate
        env: { GH_TOKEN: "${{ github.token }}", EVENT: "${{ github.event_name }}" }
        run: |
          day=$(TZ=Asia/Kolkata date +%F); now=$(TZ=Asia/Kolkata date +%H%M); go=true
          if [ "$EVENT" = "schedule" ]; then
            if [ $((10#$now)) -lt 1228 ]; then go=false; echo "It is $now IST, before 12:28: nothing to do yet."
            elif gh release view "ep-$day" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then go=false; echo "Today's episode ($day) is already out."
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  episode:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    concurrency: { group: episode, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      # the listening check: open-source speech-to-text on the runner (the model, about 150 MB, is cached)
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/audio/requirements-verify.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base-en-v1 }
      - name: Install the listening check
        run: |
          python3 -m pip install -q -r engine/audio/requirements-verify.txt
          python3 -c "from faster_whisper import WhisperModel; WhisperModel('base.en', device='cpu', compute_type='int8'); print('listening check ready')"
      - name: Make the episode
        env:
          GEMINI_KEY_REHEARSAL: ${{ github.event_name != 'schedule' && inputs.mode != 'live' && secrets.GEMINI_KEY_REHEARSAL || '' }}
          GEMINI_KEY_LIVE: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && secrets.GEMINI_KEY_LIVE || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node engine/episode.mjs --mode=${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'test' }} ${{ inputs.force && '--force' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            .out/*/episode.mp3
            .out/*/episode.vtt
            .out/*/script.md
            .out/*/pack.md
            .out/*/verify/*-take.wav
            .out/*/verify/*.out.json
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Publish the feed and remember what was said
        if: ${{ success() && (github.event_name == 'schedule' || inputs.mode == 'live') && hashFiles('.out/site/feed.xml') != '' }}
        run: |
          git config user.name "episode"
          git config user.email "episode@users.noreply.github.com"
          git add ledger
          git commit -m "Episode $(TZ=Asia/Kolkata date +%Y-%m-%d): what was said" || echo "nothing new"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          cp -r .out/site /tmp/site && { [ -f cover.jpg ] && cp cover.jpg /tmp/site/ || true; }
          rm -rf .out
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then git checkout -B gh-pages origin/gh-pages; else git checkout --orphan gh-pages; fi
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/site/. .
          git add -A && git commit -m "Feed $(TZ=Asia/Kolkata date +%Y-%m-%d)" && git push origin gh-pages
